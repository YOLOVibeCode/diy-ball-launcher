<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 940" width="1080" height="940" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">Launcher, top view</title>
<desc id="d">Plan of the launcher table: two deck panels either side of a dropped ball chute, two 10 inch wheels 18 inches apart at the front with guards, hinges at the rear edge and an elevation rod at each front corner.</desc>
<defs>
<marker id="da" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1.2 10 5 0 8.8z" fill="#1d4ed8"/></marker>
