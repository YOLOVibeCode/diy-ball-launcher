<text x="741" y="257" text-anchor="start" class="dimt">6</text>
<path d="M707.6 214.6 L764 146" class="lead" />
<circle cx="707.6" cy="214.6" r="2.2" class="" fill="#52606d"/>
<text x="770" y="150" text-anchor="start">Outrigger block and 1/2 in threaded rod,</text>
<text x="770" y="166" text-anchor="start">one each side: sets the elevation</text>
<path d="M658 245 L764 228" class="lead" />
<circle cx="658" cy="245" r="2.2" class="" fill="#52606d"/>
<text x="770" y="232" text-anchor="start">Wheel guard: expanded metal with a</text>
<text x="770" y="248" text-anchor="start">plywood top. Open only toward the ball.</text>
<path d="M611.6 355.4 L764 314" class="lead" />
<circle cx="611.6" cy="355.4" r="2.2" class="" fill="#52606d"/>
<text x="770" y="318" text-anchor="start">10 in pneumatic wheel on a treadmill</text>
<text x="770" y="334" text-anchor="start">motor. The motor hangs under the deck,</text>
<text x="770" y="350" text-anchor="start">shaft up.</text>
<path d="M554 305.8 L730 416 L764 416" class="lead" />
<circle cx="554" cy="305.8" r="2.2" class="" fill="#52606d"/>
<text x="770" y="420" text-anchor="start">This motor sits on slotted holes.</text>
<text x="770" y="436" text-anchor="start">Slide it to set the gap.</text>
<path d="M618 525 L764 496" class="lead" />
<circle cx="618" cy="525" r="2.2" class="" fill="#52606d"/>
<text x="770" y="500" text-anchor="start">Deck: two 11 x 36 panels of 3/4 in</text>
<text x="770" y="516" text-anchor="start">plywood on a 2x4 frame</text>
<path d="M464.4 581 L710 576 L764 576" class="lead" />
<circle cx="464.4" cy="581" r="2.2" class="" fill="#52606d"/>
<text x="770" y="580" text-anchor="start">Chute floor, 2-1/4 in below the deck top,</text>
<text x="770" y="596" text-anchor="start">so the ball centre sits level with the</text>
<text x="770" y="612" text-anchor="start">middle of the tires</text>
<path d="M701.2 701 L764 686" class="lead" />
<circle cx="701.2" cy="701" r="2.2" class="" fill="#52606d"/>
<text x="770" y="690" text-anchor="start">Sub-base (dashed): 38 x 36, 3/4 in</text>
<text x="770" y="706" text-anchor="start">plywood, stays flat on the ground</text>
<path d="M598 777.8 L740 766 L764 766" class="lead" />
<circle cx="598" cy="777.8" r="2.2" class="" fill="#52606d"/>
<text x="770" y="770" text-anchor="start">Two heavy hinges join the table's rear</text>
<text x="770" y="786" text-anchor="start">rail to the sub-base</text>
<text x="28" y="918" text-anchor="start" class="small">Wheels turn toward each other (white arrows). Both speeds set the power; a speed difference curves the shot.</text>
</svg>
