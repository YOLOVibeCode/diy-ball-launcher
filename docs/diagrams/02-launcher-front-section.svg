<circle cx="769.8" cy="546" r="2.2" class="" fill="#52606d"/>
<text x="900" y="520" text-anchor="start">2x4 frame, 11 in legs: room for</text>
<text x="900" y="536" text-anchor="start">the motors. Measure yours first.</text>
<path d="M829.6 652.4 L894 586" class="lead" />
<circle cx="829.6" cy="652.4" r="2.2" class="" fill="#52606d"/>
<text x="900" y="590" text-anchor="start">Sub-base</text>
<text x="28" y="760" text-anchor="start" class="small">Chute depth rule: ball centre (4-3/8 above the chute floor) must equal the height of the middle of the tires. Re-measure once the wheels are on the motors.</text>
