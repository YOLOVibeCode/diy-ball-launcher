<line x1="560" y1="224" x2="695.6" y2="366.4" class="lead" />
<circle cx="695.6" cy="366.4" r="2.2" class="" fill="#52606d"/>
<text x="520" y="200" text-anchor="start">Star-wheel gate on a 12 V worm gearmotor:</text>
<text x="520" y="216" text-anchor="start">one ball per quarter turn</text>
<line x1="930" y1="174" x2="898.8" y2="300" class="lead" />
<circle cx="898.8" cy="300" r="2.2" class="" fill="#52606d"/>
<text x="880" y="150" text-anchor="start">Queue: 6 balls on two 1 in PVC rails,</text>
<text x="880" y="166" text-anchor="start">6-1/2 in centre to centre</text>
<line x1="640" y1="456" x2="631.9" y2="416.7" class="lead" />
<circle cx="631.9" cy="416.7" r="2.2" class="" fill="#52606d"/>
<text x="566" y="470" text-anchor="start">Run-out, 36 in: the ball gathers speed</text>
<text x="566" y="486" text-anchor="start">to roll through the chute</text>
<line x1="486" y1="540" x2="477.4" y2="514.3" class="lead" />
<circle cx="477.4" cy="514.3" r="2.2" class="" fill="#52606d"/>
<text x="490" y="546" text-anchor="start" class="small">Hinge: the table's rear rail to the sub-base</text>
<text x="28" y="648" text-anchor="start" class="small">Raising the tilt lifts the chute, so the ball has to roll uphill to the wheels. For high shots, stand the ramp higher or steeper (8 to 15 degrees) until the ball still reaches the wheels.</text>
</svg>
