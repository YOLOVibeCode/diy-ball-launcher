<circle cx="213.3" cy="335.7" r="2.2" class="" fill="#52606d"/>
<text x="36" y="292" text-anchor="start">Threaded rod and wing nut,</text>
<text x="36" y="308" text-anchor="start">one each side</text>
<line x1="334" y1="222" x2="288.2" y2="388.5" class="lead" />
<circle cx="288.2" cy="388.5" r="2.2" class="" fill="#52606d"/>
