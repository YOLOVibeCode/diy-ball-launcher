<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 670" width="1290" height="670" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">Whole machine, side view</title>
<desc id="d">Side view: balls queue on a sloped PVC ramp, a star-wheel gate lets one through at a time, it rolls down a run-out into the chute and between the wheels, and the shot leaves to the left. The table tilts on a rear hinge.</desc>
