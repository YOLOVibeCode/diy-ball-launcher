<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 900" width="1220" height="900" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">Feed gate</title>
<desc id="d">Three plan views of the four-arm star wheel beside the ramp at 0, 45 and 80 degrees, showing one arm holding the first ball while the next arm slips between the first and second balls, plus a section across the ramp.</desc>
