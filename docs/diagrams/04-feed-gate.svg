<text x="930" y="369.1" text-anchor="middle" class="dimt">rails 6-1/2</text>
<line x1="930" y1="242.9" x2="1024.2" y2="242.9" class="ext" />
<line x1="978.8" y1="300" x2="1024.2" y2="300" class="ext" />
<line x1="1019.2" y1="242.9" x2="1019.2" y2="300" class="dim" marker-start="url(#db)" marker-end="url(#da)"/>
<text x="1026.2" y="275.4" text-anchor="start" class="dimt">3-13/16</text>
<circle cx="736.5" cy="217.7" r="10" class="" fill="#1f2933"/>
<text x="736.5" y="222.2" text-anchor="middle" class="bal">1</text>
<circle cx="763.5" cy="288.9" r="10" class="" fill="#1f2933"/>
<text x="763.5" y="293.4" text-anchor="middle" class="bal">2</text>
<circle cx="786" cy="343.6" r="10" class="" fill="#1f2933"/>
<text x="786" y="348.1" text-anchor="middle" class="bal">3</text>
<circle cx="730" cy="496" r="10" class="" fill="#1f2933"/>
<text x="730" y="500.5" text-anchor="middle" class="bal">1</text>
<text x="750" y="500" text-anchor="start">Star wheel: 3/4 in plywood, four arms 1 in wide, tips</text>
<text x="750" y="516" text-anchor="start">on a 16 in circle. It turns level with the ball centre,</text>
<text x="750" y="532" text-anchor="start">above the rails.</text>
<circle cx="730" cy="568" r="10" class="" fill="#1f2933"/>
<text x="730" y="572.5" text-anchor="middle" class="bal">2</text>
<text x="750" y="572" text-anchor="start">12 V worm gearmotor bolted under a small pedestal,</text>
<text x="750" y="588" text-anchor="start">shaft up. Worm gearing cannot be pushed round by</text>
<text x="750" y="604" text-anchor="start">the weight of the queue.</text>
<circle cx="730" cy="640" r="10" class="" fill="#1f2933"/>
<text x="730" y="644.5" text-anchor="middle" class="bal">3</text>
<text x="750" y="644" text-anchor="start">Gate plate: plywood under both rails, on blocks so the</text>
<text x="750" y="660" text-anchor="start">ball clears it. Slot the pedestal bolts about 1/2 in</text>
<text x="750" y="676" text-anchor="start">each way for tuning.</text>
<text x="720" y="730" text-anchor="start" class="small">Speed: one ball per quarter turn. A 6 RPM gearmotor feeds a ball</text>
<text x="720" y="746" text-anchor="start" class="small">every 2.5 seconds flat out; the PWM knob slows it to the 4 to 6</text>
<text x="720" y="762" text-anchor="start" class="small">seconds you start with.</text>
<text x="720" y="778" text-anchor="start" class="small"></text>
<text x="720" y="794" text-anchor="start" class="small">The geometry is calculated for a size 5 ball and has not been</text>
<text x="720" y="810" text-anchor="start" class="small">built yet. Test it by hand before fitting the motor.</text>
</svg>
