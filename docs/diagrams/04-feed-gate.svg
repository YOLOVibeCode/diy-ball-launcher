<text x="165" y="634.5" text-anchor="start" class="b">C · Release (80 degrees)</text>
<text x="165" y="840.2" text-anchor="start" class="small">Ball 1 clears the arm tip and rolls away down the run-out.</text>
<text x="165" y="855.2" text-anchor="start" class="small">At 90 degrees the gate is back at A with ball 2 in place.</text>
