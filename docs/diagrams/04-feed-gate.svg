<text x="165" y="374.6" text-anchor="start" class="b">B · Split (45 degrees)</text>
<text x="165" y="580.2" text-anchor="start" class="small">The next arm has slipped into the gap between balls 1 and 2</text>
<text x="165" y="595.2" text-anchor="start" class="small">and now holds the queue back. Ball 1 follows the first arm.</text>
