<line x1="300" y1="232" x2="300" y2="271" class="ext" />
<line x1="372" y1="232" x2="372" y2="271" class="ext" />
<line x1="300" y1="266" x2="372" y2="266" class="dim" marker-start="url(#db)" marker-end="url(#da)"/>
<text x="336" y="260" text-anchor="middle" class="dimt">8 to tip</text>
