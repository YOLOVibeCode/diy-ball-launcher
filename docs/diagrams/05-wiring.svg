<text x="762" y="368" text-anchor="start" class="small">armature -</text>
<text x="906" y="453" text-anchor="start" class="small">12 V +</text>
<text x="906" y="509" text-anchor="start" class="small">12 V -</text>
<line x1="28" y1="640" x2="64" y2="640" class="hot" />
<text x="74" y="644" text-anchor="start" class="small">Hot (black), through the switch and fuses</text>
<line x1="28" y1="662" x2="64" y2="662" class="neu" />
<text x="74" y="666" text-anchor="start" class="small">Neutral (white)</text>
<line x1="28" y1="684" x2="64" y2="684" class="gnd" />
<text x="74" y="688" text-anchor="start" class="small">Ground (green): cord, box, motor frames, guards</text>
<line x1="28" y1="706" x2="64" y2="706" class="ap" />
<text x="74" y="710" text-anchor="start" class="small">Motor armature +</text>
<line x1="428" y1="640" x2="464" y2="640" class="am" />
<text x="474" y="644" text-anchor="start" class="small">Motor armature -</text>
<line x1="428" y1="662" x2="464" y2="662" class="vp" />
<text x="474" y="666" text-anchor="start" class="small">12 V +</text>
<line x1="428" y1="684" x2="464" y2="684" class="vm" />
<text x="474" y="688" text-anchor="start" class="small">12 V -</text>
<text x="28" y="738" text-anchor="start" class="small">Fuse each drive as its manual says. Cap each drive's top speed and check it with a tachometer: neither wheel should pass 2,000 RPM.</text>
<text x="28" y="754" text-anchor="start" class="small">Swap a motor's two armature leads to reverse it. Treadmill motors run on about 90 to 130 V DC: keep every terminal inside the</text>
<text x="28" y="770" text-anchor="start" class="small">closed box and unplug before opening it.</text>
</svg>
