<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 780" width="1120" height="780" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<title id="t">Wiring</title>
<desc id="d">Wiring: wall outlet, GFCI plug, cord, then inside a closed control box an emergency stop switch feeding two fused DC drives for the wheel motors and a 12 volt supply for the feed gate. Every metal part is bonded to ground.</desc>
